[package]
name = "waxwing"
version = "0.1.0"
edition = "2024"
description = "Seal and verify graph-node deployment dumps for handoff between indexers"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
arrow = { version = "60.0.0", default-features = false }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.12.0"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

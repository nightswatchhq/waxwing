name: waxwing-rig

x-postgres: &postgres
  image: postgres:16
  command: ["postgres", "-cshared_preload_libraries=pg_stat_statements", "-cmax_connections=200"]
  environment:
    POSTGRES_USER: graph-node
    POSTGRES_PASSWORD: let-me-in
    POSTGRES_DB: graph-node
    POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"

x-graph-node: &graph-node
  image: ${GRAPH_NODE_IMAGE:-graphprotocol/graph-node:v0.45.0}
  environment: &graph-node-env
    ipfs: "ipfs:5001"
    node_id: default
    BLOCK_INGESTOR: default
    GRAPH_LOG: info
    ETHEREUM_POLLING_INTERVAL: 500
    # The rig subgraph has a fulltext search, which graph-node otherwise refuses.
    GRAPH_ALLOW_NON_DETERMINISTIC_FULLTEXT_SEARCH: "true"
    GRAPH_STORE_WRITE_BATCH_DURATION: ${GRAPH_STORE_WRITE_BATCH_DURATION:-300}
    ETHEREUM_REORG_THRESHOLD: ${ETHEREUM_REORG_THRESHOLD:-250}

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["anvil", "--host", "0.0.0.0"]
    ports: ["${ANVIL_PORT:-18545}:8545"]
  ipfs:
    image: ipfs/kubo:v0.39.0
    ports: ["${IPFS_PORT:-15001}:5001"]
  postgres-a:
    <<: *postgres
    ports: ["15432:5432"]
  postgres-b:
    <<: *postgres
    ports: ["25432:5432"]
  # The publisher.
  graph-node-a:
    <<: *graph-node
    depends_on: [anvil, ipfs, postgres-a]
    ports: ["18000:8000", "18020:8020", "18030:8030"]
    environment:
      <<: *graph-node-env
      GRAPH_NODE_CONFIG: /config/a${CONFIG_SUFFIX:-}.toml
    volumes: ["./config:/config:ro", "./work/dumps:/dumps"]
  # The receiver. Never told about the subgraph except through restore.
  graph-node-b:
    <<: *graph-node
    depends_on: [anvil, ipfs, postgres-b]
    ports: ["28000:8000", "28020:8020", "28030:8030"]
    environment:
      <<: *graph-node-env
      GRAPH_NODE_CONFIG: /config/b${CONFIG_SUFFIX:-}.toml
    volumes: ["./config:/config:ro", "./work/dumps:/dumps"]
